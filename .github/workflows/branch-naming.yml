name: Branch Naming Validation

on:
  create:
    branches: ['*']

jobs:
  validate-branch-name:
    runs-on: ubuntu-latest
    if: github.event.ref_type == 'branch'
    steps:
      - name: Validate branch name
        run: |
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          echo "Validating branch name: $BRANCH_NAME"

          # Allowed branch names match .claude/rules/branching.md.
          if [[ "$BRANCH_NAME" == "main" || "$BRANCH_NAME" == "staging" ]]; then
            echo "Branch name $BRANCH_NAME is allowed (protected)"
            exit 0
          fi

          # Pattern: feat/*, fix/*, refactor/*, test/*, docs/*, claude/* (worktree)
          if [[ "$BRANCH_NAME" =~ ^(feat|fix|refactor|test|docs|claude)/.+ ]]; then
            echo "Branch name $BRANCH_NAME follows naming convention"
            exit 0
          else
            echo "Branch name $BRANCH_NAME does not follow naming convention"
            echo "Allowed: main, staging, feat/*, fix/*, refactor/*, test/*, docs/*, claude/*"
            exit 1
          fi