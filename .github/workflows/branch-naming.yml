name: Branch Naming Validation

on:
  create:
    branches: ['*']

jobs:
  validate-branch-name:
    runs-on: ubuntu-latest
    if: github.event.ref_type == 'branch'
    steps:
      - name: Validate branch name
        run: |
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          echo "Validating branch name: $BRANCH_NAME"

          # Allow main and develop
          if [[ "$BRANCH_NAME" == "main" || "$BRANCH_NAME" == "develop" ]]; then
            echo "Branch name $BRANCH_NAME is allowed"
            exit 0
          fi

          # Check pattern: feature/*, bugfix/*, hotfix/*, release/*
          if [[ "$BRANCH_NAME" =~ ^(feature|bugfix|hotfix|release)/.+ ]]; then
            echo "Branch name $BRANCH_NAME follows naming convention"
            exit 0
          else
            echo "Branch name $BRANCH_NAME does not follow naming convention"
            echo "Allowed patterns: feature/*, bugfix/*, hotfix/*, release/*"
            exit 1
          fi