name: Branch Protection
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch protection
        run: |
          if [[ "$GITHUB_HEAD_REF" == "main" ]]; then
            echo "Direct pushes to protected branches are not allowed"
            exit 1
          fi