# Default configuration for day trading platform
# DO NOT store API keys here - use environment variables or OS keychain

[app]
name = "DayTrader"
version = "0.1.0"
environment = "development"  # development, paper, production

[broker]
provider = "alpaca"
is_paper = true
base_url = "https://paper-api.alpaca.markets"
ws_url = "wss://stream.data.alpaca.markets/v2/iex"

[database]
path = "data/db/daytrader.db"
max_connections = 10
enable_wal = true

[logging]
level = "info"  # trace, debug, info, warn, error
file_path = "data/logs/daytrader.log"
max_file_size_mb = 100
max_files = 10

[risk]
# Daily loss limits
max_daily_loss_dollars = 500.00
max_daily_loss_percent = 2.00
halt_trading_on_limit = true

# Position sizing
max_position_size_dollars = 5000.00
max_position_size_percent = 10.00
max_concurrent_positions = 5

# PDT protection
enforce_pdt_rule = true
pdt_min_equity = 25000.00
max_day_trades_under_pdt = 3

# Pattern-specific rules
max_trades_per_pattern_per_day = 5
stop_pattern_after_consecutive_losses = 3
required_win_rate_for_auto = 60.00
min_pattern_sample_size = 20

# Account safeguards
min_account_balance = 1000.00
emergency_liquidate_threshold = 500.00

# Market holiday calendar configuration
[holidays]
# Enable holiday calendar for business day calculations
enabled = true

# Enable specific US market holidays (NYSE/NASDAQ schedule)
enabled_holidays = [
    "new_years_day",
    "martin_luther_king_day",
    "presidents_day",
    "good_friday",
    "memorial_day",
    "independence_day",
    "labor_day",
    "thanksgiving_day",
    "christmas_day"
]

# Custom additional holidays (optional)
# Format: [name, month, day]
custom_holidays = [
    # Example: ["Company Holiday", 3, 15]
]

# Performance settings
enable_cache = true
cache_years_ahead = 5

# Pattern-specific risk profiles
[pattern_profiles.hammer]
max_trades_per_day = 3
max_position_size_multiplier = 0.7
min_confidence_threshold = 0.75
risk_multiplier = 0.6
stop_after_consecutive_losses = 3

[pattern_profiles.doji]
max_trades_per_day = 2
max_position_size_multiplier = 0.5
min_confidence_threshold = 0.80
risk_multiplier = 0.4
stop_after_consecutive_losses = 2

[pattern_profiles.bullish_engulfing]
max_trades_per_day = 4
max_position_size_multiplier = 0.85
min_confidence_threshold = 0.70
risk_multiplier = 0.8
stop_after_consecutive_losses = 3

[pattern_profiles.bearish_engulfing]
max_trades_per_day = 4
max_position_size_multiplier = 0.85
min_confidence_threshold = 0.70
risk_multiplier = 0.8
stop_after_consecutive_losses = 3

[pattern_profiles.morning_star]
max_trades_per_day = 5
max_position_size_multiplier = 0.95
min_confidence_threshold = 0.65
risk_multiplier = 0.9
stop_after_consecutive_losses = 3

[pattern_profiles.evening_star]
max_trades_per_day = 5
max_position_size_multiplier = 0.95
min_confidence_threshold = 0.65
risk_multiplier = 0.9
stop_after_consecutive_losses = 3

# Confidence-based risk multipliers
[[confidence_multipliers]]
min_confidence = 0.0
max_confidence = 0.3
position_size_multiplier = 0.3
trade_limit_multiplier = 0.5
risk_limit_multiplier = 0.3

[[confidence_multipliers]]
min_confidence = 0.3
max_confidence = 0.5
position_size_multiplier = 0.5
trade_limit_multiplier = 0.7
risk_limit_multiplier = 0.5

[[confidence_multipliers]]
min_confidence = 0.5
max_confidence = 0.7
position_size_multiplier = 0.8
trade_limit_multiplier = 0.9
risk_limit_multiplier = 0.8

[[confidence_multipliers]]
min_confidence = 0.7
max_confidence = 0.9
position_size_multiplier = 1.0
trade_limit_multiplier = 1.0
risk_limit_multiplier = 1.0

[[confidence_multipliers]]
min_confidence = 0.9
max_confidence = 1.0
position_size_multiplier = 1.2
trade_limit_multiplier = 1.1
risk_limit_multiplier = 1.1

# Pattern performance thresholds
[pattern_performance_thresholds]
min_win_rate_short = 50.0
min_win_rate_medium = 55.0
min_win_rate_long = 60.0
max_consecutive_losses = 3
min_sample_size = 20
auto_disable_threshold = 40.0

# Rolling window performance configuration
[rolling_windows]
enabled = true
windows_days = [7, 30, 90]
performance_update_interval_seconds = 300  # 5 minutes
cleanup_old_records_days = 365

# Performance-based risk escalation/de-escalation rules
[risk_escalation]
enabled = true
escalation_threshold = 0.4  # Performance score below this triggers escalation
deescalation_threshold = 0.7  # Performance score above this triggers de-escalation
escalation_rate = 1.1  # Multiply risk by this factor when escalating
deescalation_rate = 0.9  # Multiply risk by this factor when de-escalating
max_risk_multiplier = 2.0  # Maximum risk multiplier allowed
min_risk_multiplier = 0.5  # Minimum risk multiplier allowed
cooldown_period_minutes = 60  # Minimum time between adjustments
require_min_sample_size = 10  # Minimum trades before applying escalation

# Risk adjustment smoothing
[risk_adjustment_smoothing]
enabled = true
smoothing_factor = 0.3  # How much weight to give to new vs old multiplier (0.0 = no smoothing, 1.0 = full smoothing)
adjustment_step_limit = 0.2  # Maximum change in multiplier per adjustment

[patterns]
enabled = [
    "hammer",
    "shooting_star",
    "doji",
    "bullish_engulfing",
    "bearish_engulfing"
]

[indicators]
sma_periods = [20, 50]
ema_periods = [12, 26]
rsi_period = 14
macd_fast = 12
macd_slow = 26
macd_signal = 9

[performance]
max_symbols_tracked = 50
candle_cache_size = 100  # Per symbol
pattern_detection_workers = 4
websocket_reconnect_max_attempts = 10
websocket_reconnect_delay_ms = 1000
order_timeout_seconds = 30

[events]
# Event subscription settings
subscribe_to_patterns = true
subscribe_to_order_fills = true
subscribe_to_position_closes = true
subscribe_to_risk_violations = true

# Event publishing settings
publish_risk_adjustments = true
publish_pattern_status = true
publish_violations = true
publish_performance_updates = true
event_throttling_enabled = false
max_events_per_second = 1000

# Event persistence settings
persistence_enabled = true
retention_days = 90
batch_insert_size = 100
important_events_only = true  # Only persist risk and pattern events

# Event metrics collection
metrics_collection = true
track_latency = true
track_volume_by_type = true
metrics_interval_seconds = 60
export_metrics_to = "prometheus"  # or "influxdb", "file"