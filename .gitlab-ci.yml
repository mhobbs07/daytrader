stages:
  - test
  - build
  - deploy

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  RUST_VERSION: "1.75"

# Cache Rust dependencies
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cargo/
    - target/

# Test stage
test:
  stage: test
  image: rust:${RUST_VERSION}
  before_script:
    - rustc --version
    - cargo --version
  script:
    - cargo test --all-features --verbose
    - cargo clippy -- -D warnings
    - cargo fmt -- --check
  only:
    - merge_requests
    - main
    - develop

# Governance checks (architecture boundaries + test quality)
governance:
  stage: test
  image: rust:${RUST_VERSION}
  script:
    - ./scripts/verify_architecture.sh
    - ./scripts/verify_test_quality.sh
  only:
    - merge_requests
    - main
    - develop

# Security audit
security:
  stage: test
  image: rust:${RUST_VERSION}
  before_script:
    - cargo install cargo-audit
  script:
    - cargo audit
  allow_failure: true
  only:
    - merge_requests
    - main

# Build Docker image
build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - main
    - develop

# Deploy to staging
deploy_staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$STAGING_HOST "
        cd /opt/daytrader &&
        docker-compose pull &&
        docker-compose up -d
      "
  environment:
    name: staging
    url: https://staging.daytrader.example.com
  only:
    - develop

# Deploy to production
deploy_production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$PROD_HOST "
        cd /opt/daytrader &&
        docker-compose pull &&
        docker-compose up -d
      "
  environment:
    name: production
    url: https://daytrader.example.com
  when: manual
  only:
    - main