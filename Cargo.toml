[package]
name = "daytrader"
version = "0.1.0"
edition = "2021"
authors = ["Day Trading Platform Team"]
description = "High-performance day trading platform with real-time market data processing"
license = "MIT"
rust-version = "1.75"

[workspace]
members = ["."]

[dependencies]
# Core async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
futures-util = "0.3"
url = "2.5"
log = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client and WebSocket
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }

# Database
rusqlite = { version = "0.30", features = ["bundled", "chrono", "uuid"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }

# Data structures and types
rust_decimal = { version = "1.33", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5.5"
uuid = { version = "1.6", features = ["serde", "v4"] }

# Technical analysis
ta = "0.5"

# Concurrency utilities
crossbeam = "0.8"
once_cell = "1.19"
parking_lot = "0.12"
async-trait = "0.1"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Configuration
config = "0.13"
toml = "0.8"

# Rate limiting
tower = { version = "0.4", features = ["limit", "buffer", "timeout"] }

# Security
keyring = "2.1"
sha2 = "0.10"

[dev-dependencies]
# Testing
mockall = "0.12"
tokio-test = "0.4"
tempfile = "3.8"
proptest = "1.4"
rand = "0.8"
env_logger = "0.11"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"
strip = "none"
debug-assertions = true
overflow-checks = true
lto = false
panic = "unwind"
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
debug = false
split-debuginfo = "off"
strip = "symbols"
debug-assertions = false
overflow-checks = false
lto = "thin"
panic = "abort"
incremental = false
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true
strip = "none"

[profile.test]
opt-level = 1
debug = true
